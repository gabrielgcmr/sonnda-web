# .github/workflows/openapi.yml
name: Web OpenAPI client

on:
  repository_dispatch:
    types: [api-openapi-ready]
  workflow_dispatch:
    inputs:
      api_sha:
        description: SHA do commit da API
        required: true
      api_run_id:
        description: Run do workflow API and OpenAPI
        required: true

permissions:
  contents: read

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    env:
      API_SHA: ${{ github.event.client_payload.api_sha || inputs.api_sha }}
      API_RUN_ID: ${{ github.event.client_payload.api_run_id || inputs.api_run_id }}
      GH_TOKEN: ${{ secrets.OPENAPI_ARTIFACT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Download immutable API artifact
        run: >-
          gh run download "$API_RUN_ID" --repo gabrielgcmr/sonnda-api
          --name "openapi-$API_SHA" --dir .openapi
      - run: bun install --frozen-lockfile
      - run: OPENAPI_SPEC="$GITHUB_WORKSPACE/.openapi/openapi.json" bun run openapi:generate
      - run: git diff --exit-code -- src/generated/openapi.d.ts
      - run: bun test
      - run: bun run build
